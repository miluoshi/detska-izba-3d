<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detská izba · 3D modely</title>
<style>
:root { color-scheme: light; --paper:#faf9f3; --ink:#26372f; --muted:#506152; --rule:#d4ddd0; --accent:#365644; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.46 system-ui,sans-serif; }
main { margin:auto; padding:clamp(16px,3vw,42px); max-width:1380px; }
h1,h2 { font:normal clamp(26px,3.7vw,43px)/1.08 Georgia,serif; margin:0; }
h2 { font-size:27px; }
header p { margin:7px 0 18px; color:var(--muted); }
button { color:var(--ink); background:#fffdf7; border:1px solid var(--rule); border-radius:8px; font:600 14px/1.15 system-ui,sans-serif; padding:10px 13px; min-height:42px; cursor:pointer; }
button:focus-visible,a:focus-visible { outline:3px solid #557997; outline-offset:3px; }
button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:white; }
button:disabled { opacity:.5; cursor:wait; }
#variants, #views, #links { display:flex; flex-wrap:wrap; align-items:center; gap:7px; }
#variants { padding-bottom:12px; }
.frame { display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,315px); gap:20px; align-items:start; }
#model { width:100%; height:clamp(410px,57vh,700px); background:#f2f3ed; overflow:hidden; border:1px solid var(--rule); border-radius:14px; }
canvas { display:block; }
#views { padding:10px 0 0; }
.card { border-top:2px solid var(--accent); padding:14px 1px; }
.card p { margin:10px 0; }
#name,#corner { color:var(--accent); font-weight:650; }
#rug { border-top:1px solid var(--rule); padding-top:10px; }
#links { gap:7px 12px; }
#links a { color:#304f45; text-underline-offset:3px; font-size:13px; }
#status { color:#812c22; font-weight:550; }
footer { margin-top:12px; border-top:1px solid var(--rule); color:var(--muted); padding-top:9px; font-size:13px; }
@media(max-width:760px) {
  .frame { grid-template-columns:1fr; gap:16px; }
  #model { height: min(58vh, 490px); min-height:320px; }
  #variants button { font-size:13px; }
  main { padding:14px; }
}
body.snapshot { margin:0; overflow:hidden; }
body.snapshot main { padding:0; max-width:none; }
body.snapshot header, body.snapshot #variants, body.snapshot .card, body.snapshot #views, body.snapshot footer, body.snapshot #status { display:none; }
body.snapshot .frame { display:block; }
body.snapshot #model { border:0; border-radius:0; width:100vw; height:100vh; min-height:0; }
</style>
</head>
<body>
<main>
  <header><h1>Detská izba</h1><p>Päť mierkových 3D modelov · izba 311 × približne 370 cm</p></header>
  <nav id="variants" aria-label="Variant rozloženia"></nav>
  <section class="frame">
    <div>
      <div id="model" aria-label="Otáčateľný 3D model detskej izby"></div>
      <div id="views" hidden>
        <button id="iso" type="button">Priestorový pohľad</button>
        <button id="top" type="button">Pohľad zhora</button>
        <button id="corner-view" type="button">Roh pri okne</button>
        <button id="export" type="button">Stiahnuť 3D (.glb)</button>
      </div>
    </div>
    <section class="card" aria-live="polite">
      <h2 id="selected"></h2>
      <p id="name"></p>
      <p id="description"></p>
      <p id="corner"></p>
      <p id="detail"></p>
      <p id="rug"></p>
      <div id="links" aria-label="Výrobky"></div>
    </section>
  </section>
  <p id="status" role="alert"></p>
  <footer>Ťahom otočíš model. Dvoma prstami ho priblížiš. Steny a skriňa sú v modeli zrezané, aby bolo vidieť nábytok. Hĺbka izby a skrine, radiátor aj poloha ventilu sú v modeli orientačné.</footer>
</main>
