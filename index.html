<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detská izba · 3D modely</title>
<style>
:root { color-scheme: light; --paper:#faf9f3; --ink:#26372f; --muted:#506152; --rule:#d4ddd0; --accent:#365644; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.46 system-ui,sans-serif; }
main { margin:auto; padding:clamp(16px,3vw,42px); max-width:1380px; }
h1,h2 { font:normal clamp(26px,3.7vw,43px)/1.08 Georgia,serif; margin:0; }
h2 { font-size:27px; }
header p { margin:7px 0 18px; color:var(--muted); }
button { color:var(--ink); background:#fffdf7; border:1px solid var(--rule); border-radius:8px; font:600 14px/1.15 system-ui,sans-serif; padding:10px 13px; min-height:42px; cursor:pointer; }
button:focus-visible,a:focus-visible { outline:3px solid #557997; outline-offset:3px; }
button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:white; }
button:disabled { opacity:.5; cursor:wait; }
#variants, #views, #links { display:flex; flex-wrap:wrap; align-items:center; gap:7px; }
#variants { padding-bottom:12px; }
.frame { display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,315px); gap:20px; align-items:start; }
#model { position:relative; width:100%; height:clamp(410px,57vh,700px); background:#f2f3ed; overflow:hidden; border:1px solid var(--rule); border-radius:14px; }
#model-controls { position:absolute; z-index:1; top:12px; right:12px; display:flex; gap:7px; }
#model-controls[hidden] { display:none; }
#model-controls button { display:grid; place-items:center; padding:0; width:44px; min-height:44px; border-radius:50%; background:rgb(250 249 243 / 76%); border-color:rgb(80 97 82 / 31%); touch-action:manipulation; }
#model-controls button[aria-pressed="true"] { background:rgb(54 86 68 / 79%); border-color:rgb(54 86 68 / 58%); }
#model-controls svg { width:24px; height:24px; opacity:.9; }
#play[aria-pressed="true"] .add-stroke { display:none; }
canvas { display:block; }
#views { padding:10px 0 0; }
.card { border-top:2px solid var(--accent); padding:14px 1px; }
.card p { margin:10px 0; }
#name,#corner { color:var(--accent); font-weight:650; }
#rug { border-top:1px solid var(--rule); padding-top:10px; }
#links { gap:7px 12px; }
#links a { color:#304f45; text-underline-offset:3px; font-size:13px; }
#status { color:#812c22; font-weight:550; }
footer { margin-top:12px; border-top:1px solid var(--rule); color:var(--muted); padding-top:9px; font-size:13px; }
@media(max-width:760px) {
  .frame { grid-template-columns:1fr; gap:16px; }
  #model { height: min(58vh, 490px); min-height:320px; }
  #variants button { font-size:13px; }
  main { padding:14px; }
}
body.snapshot { margin:0; overflow:hidden; }
body.snapshot main { padding:0; max-width:none; }
body.snapshot header, body.snapshot #variants, body.snapshot .card, body.snapshot #views, body.snapshot #model-controls, body.snapshot footer, body.snapshot #status { display:none; }
body.snapshot .frame { display:block; }
body.snapshot #model { border:0; border-radius:0; width:100vw; height:100vh; min-height:0; }
</style>
</head>
<body>
<main>
  <header><h1>Detská izba</h1><p>Päť rozložení z typových dielov s pohybom v priestore</p></header>
  <nav id="variants" aria-label="Variant rozloženia"></nav>
  <section class="frame">
    <div>
      <div id="model" aria-label="Otáčateľný 3D model detskej izby">
        <div id="model-controls" hidden>
          <button id="play" type="button" aria-label="Pohybové prvky" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="10.3" cy="4.1" r="1.65"/>
              <path d="m4.2 11 2.4-2.6 3.5-.7 3 3.1 2.1.3m-5.1-3.4L8.6 13l3.4 2.3 1.5 4.4M8.6 13l-2.3 4.1-3.3 1.7m13.8-12.9h4.8"/>
              <path class="add-stroke" d="M19.2 3.5v4.8"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="views" hidden>
        <button id="iso" type="button">Priestorový pohľad</button>
        <button id="top" type="button">Pohľad zhora</button>
        <button id="corner-view" type="button">Roh pri okne</button>
        <button id="export" type="button">Stiahnuť 3D (.glb)</button>
      </div>
    </div>
    <section class="card" aria-live="polite">
      <h2 id="selected"></h2>
      <p id="name"></p>
      <p id="description"></p>
      <p id="corner"></p>
      <p id="detail"></p>
      <p id="stow"></p>
      <p id="rug"></p>
      <div id="links" aria-label="Výrobky"></div>
    </section>
  </section>
  <p id="status" role="alert"></p>
  <footer>Ťahom otočíš model. Dvoma prstami ho priblížiš. Biela skriňa aj otvorené dvere sú polopriehľadné. Steny majú modelovú výšku 255 cm. Pri otáčaní sa odkryjú na strane kamery. Rozmery skrine, hĺbka izby a poloha ventilu sú orientačné.</footer>
</main>
